server:
  port: 8085
  error:
    include-message: always

spring:
  application:
    name: ticket-service
  datasource:
    url: jdbc:mysql://localhost:3306/pagoflex_tickets?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

app:
  uploads:
    dir: uploads

jwt:
  secret: UGFnb0ZsZXhTZWNyZXRLZXlNdXlTZWd1cmFQYXJhSldUMjAyNiE=

springdoc:
  api-docs:
    path: /api/tickets/v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
