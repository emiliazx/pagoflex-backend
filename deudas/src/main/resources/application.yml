server:
  port: 8082
  error:
    include-message: always

spring:
  application:
    name: deudas-service
  datasource:
    url: jdbc:mysql://localhost:3306/pagoflex_deudas?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

jwt:
  secret: UGFnb0ZsZXhTZWNyZXRLZXlNdXlTZWd1cmFQYXJhSldUMjAyNiE=

springdoc:
  api-docs:
    path: /api/deudas/v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
